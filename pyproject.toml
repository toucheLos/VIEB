[project]
name = "vieb"
version = "0.1.0"
description = "Video Interpreter for Experimental Behavior"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "MIT"
authors = [
    {name = "Carlos Eckert"}
]

# Core dependencies — everything needed to run the ML pipeline and GUI
# No GPU, no DLC, no heavy tracking stack required
dependencies = [
    "numpy>=1.24,<2.3",
    "opencv-python-headless>=4.11",
    "scikit-learn>=1.5,<2.0",
    "scipy>=1.11",
    "pandas>=2.0",
    "matplotlib>=3.8",
    "umap-learn>=0.5",
    "hdbscan>=0.8",
    "seaborn>=0.13",
    "pyyaml>=6.0",
    "joblib>=1.3",
    "h5py>=3.10",
    "tables>=3.8",
    "PyQt5>=5.15",
    "pyqtgraph>=0.13",
    "pytest>=7.0",
    "openpyxl",
    "networkx>=3.0"
]

[project.optional-dependencies]

# GPU acceleration via RAPIDS — keep pins aligned with the default
# compatibility-first stack in _utils.GPU_STACKS.
# pip install -e ".[gpu]"
gpu = [
    "cuml-cu12==24.12.0",
    "cudf-cu12==24.12.0",
    "cupy-cuda12x==12.2.0",
    "cuda-python==12.2.1",
    "cuda-toolkit[cublas,cufft,curand,cusolver,cusparse]==12.2.2",
    "nvidia-cuda-runtime-cu12==12.2.140",
    "nvidia-cuda-nvrtc-cu12==12.2.140",
    "nvidia-nvjitlink-cu12==12.2.140",
    "nvidia-cublas-cu12==12.2.5.6",
    "nvidia-cufft-cu12==11.0.8.103",
    "nvidia-curand-cu12==10.3.3.141",
    "nvidia-cusolver-cu12==11.5.2.141",
    "nvidia-cusparse-cu12==12.1.2.141",
]

# PyTorch — needed for some optional features, install separately to control CUDA version
# pip install torch --index-url https://download.pytorch.org/whl/cu122
# Listed here for reference only — do not install via pip install -e .[torch]
# as the CUDA variant must match your driver
torch = [
    "torch>=2.0",
]

# DeepLabCut pose estimation — only needed for Stage 1 (DLC training + analysis)
# Heavy dependency, conflicts with RAPIDS — use a separate environment if possible
# pip install -e ".[deeplabcut]"
deeplabcut = [
    "deeplabcut[gui]==3.0.0rc13",
    "tables==3.10.1",
    "torchvision",
    "napari==0.4.18",
    "vispy==0.12.2",
    "napari-console==0.1.4",
    "napari-deeplabcut==0.2.1.7",
    "PySide6==6.10.2",
    "numba==0.63.1",
    "imgaug==0.4.0",
    "filterpy==1.4.5",
    "scikit-image>=0.25",
    "networkx>=3.4",
    "ruamel.yaml>=0.18",
    "timm>=1.0",
    "huggingface_hub>=0.20",
]

# Topological data analysis — only needed for feature_mode="topological"
# (ml/representations/topological.py). Kept optional: TDA is computationally
# expensive and exploratory (docs/DECISIONS.md — statistics-methods branch).
# pip install -e ".[topology]"
topology = [
    "ripser>=0.6",
]

# Development
dev = [
    "pytest>=7.0",
    "pytest-qt>=4.0",
]

[tool.setuptools.packages.find]
include = ["ml*", "views*"]
